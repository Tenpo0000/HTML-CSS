<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <div class="menu-esquerda">
            <a href="index.html">
                <img src="img/te-logo.png" alt="" class="logoempresa">
                <h1>Tech Experience 2026</h1>
            </a>
        </div>
            
        <div class="menu-direita">
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="sobre.html">Sobre</a></li>
                    <li><a href="#inscricao.html">inscrição</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <h2>Formulario de Inscrição</h2>
        <form>
            <fieldset>
                <legend>Dados Pessoais</legend>

                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" required placeholder="digite o seu nome"><br>
                
                <label for="email">Email:</label>
                <input type="email" id="email"  required placeholder="digite o seu email"><br>
                
                <label for="telefone">Telefone:</label>
               .<input type="tel" id="telefone" required placeholder="digite o seu telefone"><br>
                
               <label for="dtnasci">Data de Nascimento:</label>
               <input type="date" id="dtnasci"required>
            </fieldset>

            <fieldset>
                <legend>Perfil</legend>
                <label for="vce">Você é:</label><br>
                
                <input type="radio" name="perfil" id="estudante"> 
                <label for="estudante">Estudante</label> <br>

                <input type="radio" name="perfil" id="professor"> 
                <label for="professor">Professor</label><br>

                <input type="radio" name="perfil" id="profissional"> 
                <label for="profissional">Profissional</label><br>
            </fieldset>

            <fieldset>
                <legend>Area de Interesse</legend>

                <input type="checkbox" name="interesse" id="ia">
                <label for="ia">Inteligência Artificial</label><br>

                <input type="checkbox" name="interesse" id="FrontEnd">
                <label for="FrontEnd">Front-end</label><br>

                <input type="checkbox" name="interesse" id="BackEnd">
                <label for="BackEnd">Back-end</label><br>
                
                <input type="checkbox" name="interesse" id="Mobile">
                <label for="Mobile">Mobile</label>
            </fieldset>

            <fieldset>
                <legend>Localização</legend>
                <label for="cidade">Cidade</label>
                <input type="text"id="cidade"><br>

                <label for="estado">Estado</label>
                <select name="estado" id="estado">
                    <option value="">Selecione</option>
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="RS">Rio Grande do Sul</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Extras</legend>
                <label for="obs">Observações</label><br>
                <textarea name="obs" id="obs"></textarea><br>
                
                <input type="checkbox" name="novidades" id="novidades">
                <label for="novidades">Desejo receber novidades no meu email</label>
            </fieldset>

            <button type="submit">Enviar Inscrição</button>
            <button type="reset">Limpar Formulário</button>
        </form>
    </main>
    
    <footer>
        <p>&copy; 2026 Tech Experience. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
